name: Build image

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # daily rebuild = fresh project screenshots

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Screenshot projects
        env:
          LESER_EMAIL: ${{ secrets.LESER_EMAIL }}
          LESER_PASSWORD: ${{ secrets.LESER_PASSWORD }}
        run: |
          mkdir -p public/screens
          npm i --no-save --no-package-lock playwright-core
          node scripts/screens.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/karavang/webkaravang:latest
            ghcr.io/karavang/webkaravang:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
